# Deploys the Music bot to Cloudflare Workers.
#
# Triggers:
#   • workflow_dispatch  -> the "deploy button" inside this PRIVATE repo's
#     Actions tab (the public Deploy-to-Cloudflare button can't see private
#     repos, so this workflow is how you deploy).
#   • push to main       -> auto-deploy.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Workers Scripts Edit + Workers KV Storage Edit +
#                          Account Settings Read (see README)
#   CLOUDFLARE_ACCOUNT_ID  from dash.cloudflare.com
#   BOT_TOKEN              from @BotFather
#   WEBHOOK_SECRET         random 32+ char string
#   LINK_SECRET            random 32+ char string
#   ADMIN_SETUP_KEY        random 32+ char string (guards /setup)

name: deploy

on:
  workflow_dispatch:
    inputs:
      run_setup:
        description: "Run /setup (set webhook + commands) after deploy"
        type: boolean
        default: true
      reset_webhook:
        description: "Force re-register the webhook even if already set"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test --silent

      - name: Secret scan (fail if any secret is committed)
        run: node scripts/secret-scan.mjs

      - name: Provision KV namespace + inject id
        run: |
          npx wrangler kv namespace create music-bot-kv --json > /tmp/kv.json 2>/dev/null || true
          KV_ID=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('/tmp/kv.json')).id||'')}catch{console.log('')}")
          if [ -z "$KV_ID" ]; then
            KV_ID=$(npx wrangler kv namespace list | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=JSON.parse(d.replace(/^[^{[]*/,''));const f=a.find(n=>n.title&&n.title.includes('music-bot-kv'))||a[0];console.log(f?f.id:'')})")
          fi
          if [ -n "$KV_ID" ]; then
            node -e "const fs=require('fs');let s=fs.readFileSync('wrangler.jsonc','utf8');if(!/\"id\"\s*:\s*\"[0-9a-f]{32}\"/.test(s)){s=s.replace(/(\"binding\"\s*:\s*\"KV\"\s*)/,'\$1,\"id\":\"'+process.env.KV_ID+'\"');fs.writeFileSync('wrangler.jsonc',s)}console.log('kv id',process.env.KV_ID)" KV_ID="$KV_ID"
          fi

      - name: Upload secrets to the worker
        run: |
          echo "${{ secrets.BOT_TOKEN }}"      | npx wrangler secret put BOT_TOKEN
          echo "${{ secrets.WEBHOOK_SECRET }}" | npx wrangler secret put WEBHOOK_SECRET
          echo "${{ secrets.LINK_SECRET }}"    | npx wrangler secret put LINK_SECRET
          echo "${{ secrets.ADMIN_SETUP_KEY }}"| npx wrangler secret put ADMIN_SETUP_KEY

      - name: Deploy worker
        id: deploy
        run: |
          OUT=$(npx wrangler deploy 2>&1)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run /setup (webhook + commands)
        if: ${{ inputs.run_setup || github.event_name == 'push' }}
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          KEY="${{ secrets.ADMIN_SETUP_KEY }}"
          if [ -z "$URL" ]; then echo "no worker url detected"; exit 1; fi
          curl -fsS "${URL}/setup?key=${KEY}" | tee /tmp/setup.json
          node -e "const r=require('/tmp/setup.json');process.exit(r.ok?0:1)"

      - name: Verify webhook
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          sleep 2
          curl -fsS "${URL}/health" | tee /tmp/health.json
          node -e "
            const h=require('/tmp/health.json');
            const w=h.webhook||{};
            if(!w.url){console.error('webhook url empty');process.exit(1)}
            console.log('webhook:',w.url,'pending:',w.pending,'error:',w.error);
          "

      - name: Job summary
        run: |
          {
            echo "## 🎧 Music bot deployed"
            echo ""
            echo "**Worker URL:** ${{ steps.deploy.outputs.worker_url }}"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| deploy | ✅ |"
            echo "| /setup | ${{ inputs.run_setup && '✅' || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
