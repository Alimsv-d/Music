# Deploys the Music bot to Cloudflare Workers.
#
# Triggers:
#   • workflow_dispatch  -> the "deploy button" inside this PRIVATE repo's
#     Actions tab (the public Deploy-to-Cloudflare button can't see private
#     repos, so this workflow is how you deploy).
#   • push to main       -> auto-deploy.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BOT_TOKEN,
#   WEBHOOK_SECRET, LINK_SECRET, ADMIN_SETUP_KEY

name: deploy

on:
  workflow_dispatch:
    inputs:
      activate:
        description: "Activate the Cloudflare bot (set Telegram webhook + commands; replaces the current webhook)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate required deployment secrets
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_BOT_TOKEN: ${{ secrets.BOT_TOKEN != '' }}
          HAS_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET != '' }}
          HAS_LINK_SECRET: ${{ secrets.LINK_SECRET != '' }}
          HAS_SETUP_KEY: ${{ secrets.ADMIN_SETUP_KEY != '' }}
        run: |
          set -eu
          for name in HAS_CF_TOKEN HAS_CF_ACCOUNT HAS_BOT_TOKEN HAS_WEBHOOK_SECRET HAS_LINK_SECRET HAS_SETUP_KEY; do
            if [ "${!name}" != "true" ]; then
              echo "::error::Required repository secret is missing: ${name#HAS_}"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test --silent

      - name: Secret scan (fail if any secret is committed)
        run: node scripts/secret-scan.mjs

      - name: Provision exact KV namespace
        run: node scripts/ensure-kv.mjs

      - name: Upload secrets to the worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
          ADMIN_SETUP_KEY: ${{ secrets.ADMIN_SETUP_KEY }}
          SHAZAM_BACKEND_URL: ${{ secrets.SHAZAM_BACKEND_URL }}
          SHAZAM_BACKEND_KEY: ${{ secrets.SHAZAM_BACKEND_KEY }}
        run: |
          printf '%s' "$BOT_TOKEN"      | npx wrangler secret put BOT_TOKEN
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET
          printf '%s' "$LINK_SECRET"    | npx wrangler secret put LINK_SECRET
          printf '%s' "$ADMIN_SETUP_KEY"| npx wrangler secret put ADMIN_SETUP_KEY
          [ -n "$SHAZAM_BACKEND_URL" ] && printf '%s' "$SHAZAM_BACKEND_URL" | npx wrangler secret put SHAZAM_BACKEND_URL || true
          [ -n "$SHAZAM_BACKEND_KEY" ] && printf '%s' "$SHAZAM_BACKEND_KEY" | npx wrangler secret put SHAZAM_BACKEND_KEY || true

      - name: Deploy worker
        id: deploy
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -e
          OUT=$(npx wrangler deploy 2>&1)
          echo "$OUT"
          URL="${{ vars.PUBLIC_URL }}"
          if [ -z "$URL" ]; then
            URL=$(echo "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          fi
          if [ -z "$URL" ]; then
            echo "::error::Could not determine worker URL. Set vars.PUBLIC_URL or ensure wrangler deploy prints a workers.dev URL."
            exit 1
          fi
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run /setup (activate Telegram webhook)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate == true }}
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          KEY="${{ secrets.ADMIN_SETUP_KEY }}"
          if [ -z "$URL" ]; then echo "no worker url detected"; exit 1; fi
          RESP=$(curl -fsS "${URL}/setup?key=${KEY}")
          echo "$RESP" > /tmp/setup.json
          node -e "
            const r=require('/tmp/setup.json');
            if(!r.ok){ console.error(JSON.stringify(r,null,2)); process.exit(1) }
            console.log('setup ok:', JSON.stringify(r.steps||{}))
          "

      - name: Verify worker health
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          sleep 2
          curl -fsS "${URL}/health" | tee /tmp/health.json

      - name: Verify Telegram webhook (only when activated)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate == true }}
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          curl -fsS "${URL}/health" | tee /tmp/health.json
          node -e "
            const h=require('/tmp/health.json');
            const w=h.webhook||{};
            const expected='${URL}/webhook';
            if(w.url!==expected){ console.error('webhook mismatch:',w.url,'!=',expected); process.exit(1) }
            if(w.error){ console.error('telegram webhook error:',w.error); process.exit(1) }
            console.log('webhook ok:',w.url)
          "

      - name: Job summary
        run: |
          {
            echo "## 🎧 Music bot deployed"
            echo ""
            echo "**Worker URL:** ${{ steps.deploy.outputs.worker_url }}"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| deploy | ✅ |"
            echo "| /setup | ${{ inputs.activate && '✅' || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
