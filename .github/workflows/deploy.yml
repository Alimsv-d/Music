name: deploy

on:
  push:
    branches: [main, master, cloudflare-cpanel-port, merge-cf-bot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      SOUNDCLOUD_API_URL: ${{ secrets.SOUNDCLOUD_API_URL }}
      SHAZAM_API_URL: ${{ secrets.SHAZAM_API_URL }}
      INSTA_API_URL: ${{ secrets.INSTA_API_URL }}
      HEAVY_AUDIO_URL: ${{ secrets.HEAVY_AUDIO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply music_bot_db --remote || true
      - name: Upload secrets
        run: |
          for s in BOT_TOKEN WEBHOOK_SECRET CRON_SECRET OWNER_ID SOUNDCLOUD_API_URL SHAZAM_API_URL INSTA_API_URL HEAVY_AUDIO_URL; do
            v=$(eval echo \$$s)
            [ -n "$v" ] && printf '%s' "$v" | npx wrangler secret put $s || true
          done
      - name: Deploy
        run: npx wrangler deploy
