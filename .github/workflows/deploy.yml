# Fully automatic deploy of the Music bot to Cloudflare Workers.
#
# Runs on EVERY push to main (or master), and can also be run manually from
# Actions → deploy → "Run workflow" (needs no inputs — repository secrets only).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — Workers Edit + KV Storage Edit + Account Read
#   CLOUDFLARE_ACCOUNT_ID
#   BOT_TOKEN             — Telegram bot token from @BotFather
#   WEBHOOK_SECRET        — random 32+ chars
# Optional secrets:
#   LINK_SECRET, ADMIN_SETUP_KEY, SHAZAM_BACKEND_URL, SHAZAM_BACKEND_KEY
#
# After deploying, the workflow registers the Telegram webhook on the worker
# and verifies it — nothing is manual.

name: deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      LINK_SECRET: ${{ secrets.LINK_SECRET }}
      ADMIN_SETUP_KEY: ${{ secrets.ADMIN_SETUP_KEY }}
      SHAZAM_BACKEND_URL: ${{ secrets.SHAZAM_BACKEND_URL }}
      SHAZAM_BACKEND_KEY: ${{ secrets.SHAZAM_BACKEND_KEY }}
      # Fallback if the deploy output doesn't include a URL (stable value):
      WORKER_URL_FALLBACK: https://music-bot.alighost5920.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required secrets
        run: |
          set -eu
          MISS=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN WEBHOOK_SECRET; do
            eval "v=\${$name:-}"
            [ -n "$v" ] || MISS="$MISS $name"
          done
          if [ -n "$MISS" ]; then
            echo "MISSING=true" >> "$GITHUB_ENV"
            echo "::notice::Action deploy skipped — missing secrets:$MISS"
            echo "This repo deploys automatically via Cloudflare Workers Builds, which needs no"
            echo "GitHub secrets. To enable this Actions path instead, add:${MISS}"
            echo "→ Settings › Secrets and variables › Actions"
          fi

      - name: Install dependencies
        if: ${{ env.MISSING != 'true' }}
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        if: ${{ env.MISSING != 'true' }}
        run: npm test

      - name: Secret scan
        if: ${{ env.MISSING != 'true' }}
        run: node scripts/secret-scan.mjs

      # If the repo leaked a token (e.g. an old branch), abort early so we do
      # not deploy it.
      - name: Provision KV namespace
        if: ${{ env.MISSING != 'true' }}
        run: node scripts/ensure-kv.mjs

      - name: Upload runtime secrets to the worker
        if: ${{ env.MISSING != 'true' }}
        run: |
          set -e
          for s in BOT_TOKEN WEBHOOK_SECRET LINK_SECRET ADMIN_SETUP_KEY OWNER_ID; do
            eval "v=\${$s:-}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler secret put "$s"; fi
          done
          if [ -n "$SHAZAM_BACKEND_URL" ]; then printf '%s' "$SHAZAM_BACKEND_URL" | npx wrangler secret put SHAZAM_BACKEND_URL; fi
          if [ -n "$SHAZAM_BACKEND_KEY" ]; then printf '%s' "$SHAZAM_BACKEND_KEY" | npx wrangler secret put SHAZAM_BACKEND_KEY; fi

      - name: Deploy worker (3 attempts)
        id: deploy
        if: ${{ env.MISSING != 'true' }}
        run: |
          set -u
          attempt=1
          OUT=""
          while [ $attempt -le 3 ]; do
            echo "::group::wrangler deploy (attempt $attempt)"
            if OUT=$(npx wrangler deploy 2>&1); then
              echo "$OUT"
              echo "::endgroup::"
              break
            fi
            echo "$OUT"
            echo "::endgroup::"
            if [ $attempt -eq 3 ]; then
              echo "::error::wrangler deploy failed after 3 attempts — see output above"
              exit 1
            fi
            attempt=$((attempt+1))
            sleep 20
          done
          URL=$(echo "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          [ -n "$URL" ] || URL="${{ vars.PUBLIC_URL }}"
          [ -n "$URL" ] || URL="$WORKER_URL_FALLBACK"
          URL="${URL%/}"
          if [ -z "$URL" ]; then
            echo "::error::Could not determine the worker URL."
            exit 1
          fi
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed worker: $URL"

      # ── Telegram webhook: set automatically on EVERY run (push or manual) ──
      - name: Set Telegram webhook
        if: ${{ env.MISSING != 'true' }}
        run: |
          set -u
          URL="${{ steps.deploy.outputs.worker_url }}"
          attempts=1
          RESP=""
          while [ $attempts -le 5 ]; do
            RESP=$(curl -sS --max-time 30 \
              "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
              --data-urlencode "url=${URL}/webhook" \
              --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
              --data-urlencode 'allowed_updates=["message","callback_query","inline_query","chosen_inline_result","my_chat_member","chat_member"]' \
              --data-urlencode "max_connections=50") && echo "$RESP" || true
            echo "$RESP" | grep -q '"ok":true' && break
            echo "setWebhook attempt $attempts did not succeed; retrying…"
            attempts=$((attempts+1))
            sleep 10
          done
          echo "$RESP" | grep -q '"ok":true' || {
            echo "::error::Telegram setWebhook failed after 5 attempts"
            exit 1
          }
          echo "Webhook registered: ${URL}/webhook"

      - name: Verify health + webhook
        if: ${{ env.MISSING != 'true' }}
        run: |
          set -u
          URL="${{ steps.deploy.outputs.worker_url }}"
          ok=""
          for i in 1 2 3 4 5 6; do
            sleep 5
            RESP=$(curl -sS --max-time 20 "${URL}/health" || true)
            if echo "$RESP" | grep -q '"ok":true'; then ok=1; echo "$RESP" | tee /tmp/health.json; break; fi
            echo "health attempt $i not ok; retrying…"
          done
          if [ -z "$ok" ]; then
            echo "::error::Worker /health did not return ok within 30s"
            exit 1
          fi
          # Confirm the webhook points at THIS worker. A stale
          # last_error_message from the previous webhook is only a warning —
          # it clears once new updates flow.
          node -e "
            const h = require('/tmp/health.json');
            const w = h.webhook || {};
            const url = String(w.url || '');
            if (url && !url.startsWith('${URL}/webhook')) {
              console.error('webhook points elsewhere:', url);
              process.exit(1);
            }
            if (w.error) console.warn('telegram last webhook error (may be stale from previous webhook):', w.error);
            console.log('webhook:', url || '(not set yet)');
          "

      - name: Job summary
        if: always()
        run: |
          [ "${MISSING:-}" = "true" ] && {
              echo "## 🎧 Music bot deploy"
              echo ""
              echo "**Skipped** — no Actions secrets configured."
              echo "_Repository deploys via Cloudflare Workers Builds instead._"
              exit 0
          }
          {
            echo "## 🎧 Music bot deploy"
            echo ""
            echo "**Worker:** ${{ steps.deploy.outputs.worker_url }}"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| unit tests | ✅ |"
            echo "| wrangler deploy | ${{ steps.deploy.conclusion == 'success' && '✅' || '❌' }} |"
            echo "| telegram webhook | set automatically |"
          } >> "$GITHUB_STEP_SUMMARY"
